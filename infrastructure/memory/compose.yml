name: studio-memory
services:
  studio-memory-postgres:
    image: pgvector/pgvector:pg16
    profiles: [memory]
    environment:
      POSTGRES_DB: studio_memory
      POSTGRES_USER: studio_memory
      POSTGRES_PASSWORD: ${STUDIO_MEMORY_POSTGRES_PASSWORD:-studio_memory_local}
    ports:
      - "127.0.0.1:${STUDIO_MEMORY_POSTGRES_PORT:-55432}:5432"
    volumes:
      - studio-memory-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U studio_memory -d studio_memory"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  studio-memory-data:
